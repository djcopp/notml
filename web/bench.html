<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>notml browser bench</title>
<style>
  :root { --bg: #fbfaf8; --fg: #1c1b19; --muted: #6b6862; --line: #e4e1db; --ok: #2f7d4f; --bad: #b3402a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151514; --fg: #ecebe8; --muted: #9a978f; --line: #2d2c2a; --ok: #6cc28f; --bad: #f08a72; }
  }
  body { background: var(--bg); color: var(--fg); font: 14px/1.5 ui-sans-serif, system-ui, sans-serif; margin: 24px 16px; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 4px; }
  #env { color: var(--muted); margin: 0 0 16px; }
  table { border-collapse: collapse; width: 100%; max-width: 960px; }
  th { font-weight: 500; color: var(--muted); }
  td, th { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
  #log { color: var(--muted); white-space: pre-wrap; }
</style>
</head>
<body>
<h1>notml browser bench</h1>
<p id="env">Loading onnxruntime-web…</p>
<table>
  <thead><tr><th>case</th><th>size</th><th>backend</th><th>median ms</th><th>answer</th><th>note</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
<pre id="log"></pre>
<script>
// Query parameters: ort=<version>, only=<case,case>, backends=webgpu,wasm, reps=<n>, verbose=1
const params = new URLSearchParams(location.search);
const ORT_VERSION = params.get("ort") || "1.30.0";
const ONLY = params.get("only")?.split(",");
const BACKENDS = (params.get("backends") || "webgpu,wasm").split(",");
const REPS = Number(params.get("reps") || 7);
const ONLY_ONNX = params.get("baseline") === "0";
const ARRAYS = { int32: Int32Array, uint32: Uint32Array, uint8: Uint8Array, float32: Float32Array, int64: BigInt64Array, bool: Uint8Array };

const log = (s) => { document.getElementById("log").textContent += s + "\n"; console.log(`[bench] ${s}`); };

function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = src; s.onload = resolve; s.onerror = reject;
    document.head.appendChild(s);
  });
}

async function loadTensor(folder, spec) {
  const buf = await (await fetch(`${folder}/${spec.file}`)).arrayBuffer();
  return new ort.Tensor(spec.dtype, new ARRAYS[spec.dtype](buf), spec.shape);
}

// Same four rules as lab/case.py Tolerance.
function correct(out, ref, tol) {
  const a = Array.from(out.data, Number), b = Array.from(ref.data, Number);
  if (a.length !== b.length) return false;
  if (tol.kind === "exact") return a.every((x, i) => x === b[i]);
  if (tol.kind === "scalar_rel") return Math.abs(a[0] - b[0]) / Math.abs(b[0]) < tol.rtol;
  if (tol.kind === "max_rel") {
    let err = 0, peak = 0;
    for (let i = 0; i < b.length; i++) { err = Math.max(err, Math.abs(a[i] - b[i])); peak = Math.max(peak, Math.abs(b[i])); }
    return err / peak < tol.rtol;
  }
  return a.every((x, i) => Math.abs(x - b[i]) <= tol.atol + tol.rtol * Math.abs(b[i]));  // "close"
}

function addRow(cells, ok) {
  const tr = document.createElement("tr");
  cells.forEach((text, i) => {
    const td = document.createElement("td");
    td.textContent = text;
    if (i === 3) td.className = "num";
    if (i === 4) td.className = ok ? "ok" : "bad";
    tr.appendChild(td);
  });
  document.getElementById("rows").appendChild(tr);
}

async function runCase(name, spec, backend, feeds, ref) {
  const options = { executionProviders: [backend], graphOptimizationLevel: "all" };
  // In loop mode keep the state on the GPU between calls instead of copying it back every time.
  if (spec.loop && backend === "webgpu") options.preferredOutputLocation = "gpu-buffer";
  const session = await ort.InferenceSession.create(`${name}/model.onnx`, options);
  const once = async () => {
    let inputs = { ...feeds }, outputs;
    for (let k = 0; k < (spec.loop ? spec.loop.calls : 1); k++) {
      outputs = await session.run(inputs);
      if (spec.loop) {
        inputs = { ...inputs };
        for (const [input, index] of Object.entries(spec.loop.feedback)) inputs[input] = outputs[session.outputNames[index]];
      }
    }
    const first = outputs[session.outputNames[0]];
    return first.location === "gpu-buffer" ? new ort.Tensor(first.type, await first.getData(), first.dims) : first;
  };
  const ok = correct(await once(), ref, spec.tolerance);
  await once();
  const times = [];
  for (let r = 0; r < REPS; r++) {
    const t = performance.now();
    await once();
    times.push(performance.now() - t);
  }
  await session.release();
  times.sort((x, y) => x - y);
  return { ms: times[Math.floor(times.length / 2)], ok };
}

// The browser's own regex engine on the same strings, decoded from the packed input once, untimed.
const decoded = new Map();
function runRegExp(spec, feeds, ref) {
  const input = feeds[spec.inputs[0].name];
  let strings = decoded.get(input);
  if (!strings) {
    const bytes = new Uint8Array(input.data.buffer, input.data.byteOffset, input.data.byteLength);
    const width = spec.inputs[0].shape[1] * input.data.BYTES_PER_ELEMENT;
    strings = [];
    for (let i = 0; i < input.dims[0]; i++) {
      let end = i * width;
      while (end < (i + 1) * width && bytes[end] !== 0) end++;
      strings.push(String.fromCharCode.apply(null, bytes.subarray(i * width, end)));
    }
    decoded.set(input, strings);
  }
  const re = new RegExp(spec.js_regexp);
  const out = new Uint8Array(strings.length);
  const once = () => { for (let i = 0; i < strings.length; i++) out[i] = re.test(strings[i]) ? 1 : 0; };
  once(); once();
  const times = [];
  for (let r = 0; r < REPS; r++) { const t = performance.now(); once(); times.push(performance.now() - t); }
  times.sort((x, y) => x - y);
  const ok = out.every((v, i) => v === Number(ref.data[i]));
  return { ms: times[Math.floor(times.length / 2)], ok };
}

(async () => {
  await loadScript(`https://cdn.jsdelivr.net/npm/onnxruntime-web@${ORT_VERSION}/dist/ort.webgpu.min.js`);
  if (params.get("verbose")) { ort.env.logLevel = "verbose"; ort.env.debug = true; }
  ort.env.wasm.numThreads = navigator.hardwareConcurrency;
  const adapter = "gpu" in navigator ? await navigator.gpu.requestAdapter() : null;
  const gpu = adapter ? (adapter.info?.description || adapter.info?.vendor || "available") : "not available";
  const env = {
    ort: ORT_VERSION, webgpu: gpu, threads: navigator.hardwareConcurrency,
    isolated: self.crossOriginIsolated, userAgent: navigator.userAgent,
  };
  document.getElementById("env").textContent =
    `onnxruntime-web ${ORT_VERSION} · WebGPU: ${gpu} · WASM threads: ${env.threads}` +
    (env.isolated ? "" : " · not cross-origin isolated, so WASM runs on one thread");

  const manifest = await (await fetch("manifest.json")).json();
  const results = [];
  for (const [name, spec] of Object.entries(manifest)) {
    if (ONLY && !ONLY.includes(name)) continue;
    const feeds = {};
    for (const input of spec.inputs) feeds[input.name] = await loadTensor(name, input);
    const ref = await loadTensor(name, spec.ref);
    if (spec.js_regexp && !ONLY_ONNX) {
      const { ms, ok } = runRegExp(spec, feeds, ref);
      addRow([name, spec.size, "js RegExp", ms.toFixed(2), ok ? "correct" : "wrong", ""], ok);
      log(`${name} regexp ${ms.toFixed(2)} ms ${ok ? "ok" : "WRONG"}`);
      results.push({ case: name, backend: "regexp", ms, correct: ok });
    }
    for (const backend of BACKENDS) {
      try {
        const { ms, ok } = await runCase(name, spec, backend, feeds, ref);
        addRow([name, spec.size, backend, ms.toFixed(2), ok ? "correct" : "wrong", ""], ok);
        log(`${name} ${backend} ${ms.toFixed(2)} ms ${ok ? "ok" : "WRONG"}`);
        results.push({ case: name, backend, ms, correct: ok });
      } catch (e) {
        addRow([name, spec.size, backend, "", "error", String(e).slice(0, 140)], false);
        results.push({ case: name, backend, error: String(e).slice(0, 300) });
      }
    }
  }
  window.benchResults = { env, results };
  log("finished");
})().catch((e) => { log(String(e)); window.benchResults = { error: String(e) }; });
</script>
</body>
</html>
